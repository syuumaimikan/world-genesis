[workspace]
resolver = "2"
members = [
    "crates/genesis-core",
    "crates/genesis-geology",
    "crates/genesis-climate",
    "crates/genesis-life",
    "crates/genesis-civilization",
    "crates/genesis-economy",
    "crates/genesis-sim",
    "crates/genesis-renderer",
    "crates/genesis-ui",
    "crates/genesis-tools",
    "crates/genesis-game",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["World Genesis Core Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.13", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_text",
    "bevy_ui",
    "x11",
    "tonemapping_luts",
    "png",
    "multi-threaded",
    "default_font",
    "bevy_gizmos",
    "bevy_sprite"
] }
glam = { version = "0.27", features = ["serde"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
zstd = "0.13"
rayon = "1.10"
thiserror = "1.0"
tracing = "0.1"
parking_lot = "0.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
